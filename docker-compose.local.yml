# Full local stack for House Pot integrations
# docker compose -f docker-compose.local.yml up -d
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - house-pot-mongo:/data/db

  temporal-db:
    image: postgres:13
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - house-pot-temporal-db:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.26.2
    ports:
      - "7233:7233"
    depends_on:
      - temporal-db
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db

  temporal-ui:
    image: temporalio/ui:2.31.2
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000

volumes:
  house-pot-mongo:
  house-pot-temporal-db:
