services:
  - type: web
    name: house-pot
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      # Public URL after first deploy — e.g. https://house-pot.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: GEMMA_BASE_URL
        sync: false
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_MODEL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: MONGODB_VECTOR_INDEX
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: BACKBOARD_ASSISTANT_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: TIGER_DATABASE_URL
        sync: false
      # Free tier: no Temporal worker — narration runs in-process
      - key: TEMPORAL_NARRATE
        value: "false"
      # No Python TabPFN on Node blueprint — skip 120s script wait on propose
      - key: TABPFN_DISABLE
        value: "true"
